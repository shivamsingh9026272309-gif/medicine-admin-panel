
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharamgo Admin Panel</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f7fa;
  color: #263238;
}

header {
  background: #1593a5;
  color: white;
  padding: 18px;
  font-size: 21px;
  font-weight: bold;
}

.container {
  display: flex;
  min-height: calc(100vh - 60px);
}

.sidebar {
  width: 220px;
  background: white;
  padding: 20px 12px;
}

.sidebar button {
  display: block;
  width: 100%;
  padding: 14px;
  border: none;
  background: white;
  text-align: left;
  font-size: 15px;
  cursor: pointer;
  border-radius: 7px;
  margin-bottom: 7px;
}

.sidebar button:hover,
.sidebar button.active {
  background: #e4f5f7;
  color: #1593a5;
}

main {
  flex: 1;
  padding: 25px;
  min-width: 0;
}

h2 {
  margin-bottom: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 25px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 2px 8px #00000008;
}

.card p {
  color: #777;
  margin-bottom: 12px;
}

.card h2 {
  color: #1593a5;
  margin: 0;
}

.panel {
  background: white;
  padding: 20px;
  border-radius: 10px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  border: 1px solid #ddd;
  border-radius: 6px;
}

.primary {
  background: #1593a5;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 6px;
  cursor: pointer;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th, td {
  padding: 13px 8px;
  text-align: left;
  border-bottom: 1px solid #eee;
}

th {
  background: #eaf6f7;
}

.hidden {
  display: none;
}

@media(max-width:600px) {
  .container {
    display: block;
  }
  .sidebar {
    width: 100%;
    display: flex;
    overflow-x: auto;
    padding: 8px;
  }
  .sidebar button {
    min-width: 110px;
    text-align: center;
    font-size: 13px;
  }
  main {
    padding: 15px;
  }
}
</style>
</head>

<body>

<header>💊 PHARAMGO ADMIN</header>

<div class="container">

<aside class="sidebar">
<button class="active" onclick="showPage('dashboard',this)">Dashboard</button>
<button onclick="showPage('medicines',this)">Medicines</button>
<button onclick="showPage('add',this)">+ Add Medicine</button>
<button onclick="showPage('orders',this)">Orders</button>
</aside>

<main>

<section id="dashboard">
<h2>Dashboard</h2>
<div class="cards">
<div class="card">
<p>Total Medicines</p>
<h2 id="total">0</h2>
</div>
<div class="card">
<p>Total Orders</p>
<h2>0</h2>
</div>
<div class="card">
<p>Customers</p>
<h2>0</h2>
</div>
</div>
<div class="panel">
<h3>Welcome to Pharamgo Admin Panel</h3>
<p style="margin-top:12px">Manage your medicines and orders here.</p>
</div>
</section>

<section id="medicines" class="hidden">
<h2>All Medicines</h2>
<div class="panel">
<table>
<thead>
<tr>
<th>Name</th>
<th>Company</th>
<th>Price</th>
</tr>
</thead>
<tbody id="medicineList"></tbody>
</table>
</div>
</section>

<section id="add" class="hidden">
<h2>Add New Medicine</h2>
<div class="panel">
<form id="medicineForm">
<label>Medicine Name</label>
<input id="name" placeholder="Enter medicine name" required>

<label>Company</label>
<input id="company" placeholder="Enter company name" required>

<label>Price (₹)</label>
<input id="price" type="number" placeholder="Enter price" required>

<button class="primary" type="submit">Add Medicine</button>
</form>
</div>
</section>

<section id="orders" class="hidden">
<h2>Orders</h2>
<div class="panel">
<p>Orders will appear here after connecting the database.</p>
</div>
</section>

</main>
</div>

<script>
let medicines = [];

function showPage(page, button) {
  document.querySelectorAll("main section").forEach(section => {
    section.classList.add("hidden");
  });

  document.getElementById(page).classList.remove("hidden");

  document.querySelectorAll(".sidebar button").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");
}

document.getElementById("medicineForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const medicine = {
    name: document.getElementById("name").value,
    company: document.getElementById("company").value,
    price: document.getElementById("price").value
  };

  medicines.push(medicine);

  document.getElementById("medicineList").innerHTML =
    medicines.map(item => `
      <tr>
        <td>${item.name}</td>
        <td>${item.company}</td>
        <td>₹${item.price}</td>
      </tr>
    `).join("");

  document.getElementById("total").textContent = medicines.length;

  this.reset();
  alert("Medicine added successfully!");
});
</script>

</body>
</html>
